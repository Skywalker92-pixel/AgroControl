# ==============================================================================
# AGROCONTROL PRO - ORQUESTACIÓN LOCAL CON DOCKER COMPOSE
# ==============================================================================
# Servicios:
#   1. agrocontrol-db: Base de datos PostgreSQL 15 con volumen persistente y healthcheck
#   2. agrocontrol-api: Backend NestJS (Node 20)
#   3. agrocontrol-web: Frontend Nginx (Vite SPA) y reverse proxy
#   4. agrocontrol-backup: Servicio auxiliar con pg_dump y rotación automatizada
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. BASE DE DATOS CENTRAL (Única fuente de verdad)
  # ----------------------------------------------------------------------------
  agrocontrol-db:
    image: postgres:15-alpine
    container_name: agrocontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-agrocontrol_db}
      POSTGRES_USER: ${DB_USER:-agrocontrol_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-agrocontrol_secret_pass_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Se expone en el puerto 5433 del host por defecto para evitar colisiones con otros Postgres
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - agrocontrol_pgdata:/var/lib/postgresql/data
      # Scripts de inicialización ejecutados automáticamente al crear la base de datos por primera vez
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-agrocontrol_user} -d ${DB_NAME:-agrocontrol_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agrocontrol-net

  # ----------------------------------------------------------------------------
  # 2. BACKEND API (NestJS / Node.js 20)
  # ----------------------------------------------------------------------------
  agrocontrol-api:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: agrocontrol-api
    restart: unless-stopped
    depends_on:
      agrocontrol-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://agrocontrol_user:agrocontrol_secret_pass_2026@agrocontrol-db:5432/agrocontrol_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-super_seguro_jwt_secret_agrocontrol_2026_pro_token}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DISPATCH_STOCK_DEDUCT_EVENT: ${DISPATCH_STOCK_DEDUCT_EVENT:-DESPACHADO}
      METODO_VALORIZACION_DEFAULT: ${METODO_VALORIZACION_DEFAULT:-PROMEDIO_PONDERADO}
    ports:
      - "${HOST_API_PORT:-3000}:3000"
    networks:
      - agrocontrol-net

  # ----------------------------------------------------------------------------
  # 3. FRONTEND WEB & REVERSE PROXY (Nginx + Vite SPA)
  # ----------------------------------------------------------------------------
  agrocontrol-web:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: agrocontrol-web
    restart: unless-stopped
    depends_on:
      - agrocontrol-api
    ports:
      - "${HOST_WEB_PORT:-80}:80"
    volumes:

      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - agrocontrol-net

  # ----------------------------------------------------------------------------
  # 4. SERVICIO AUXILIAR DE RESPALDOS AUTOMATIZADOS (pg_dump + crond)
  # ----------------------------------------------------------------------------
  agrocontrol-backup:
    image: postgres:15-alpine
    container_name: agrocontrol-backup
    restart: unless-stopped
    depends_on:
      agrocontrol-db:
        condition: service_healthy
    environment:
      DB_HOST: agrocontrol-db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-agrocontrol_db}
      DB_USER: ${DB_USER:-agrocontrol_user}
      DB_PASSWORD: ${DB_PASSWORD:-agrocontrol_secret_pass_2026}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ../backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
      - ./scripts/restore.sh:/restore.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "${CRON_SCHEDULE:-0 2 * * *} /bin/sh /backup.sh >> /var/log/cron.log 2>&1" > /etc/crontabs/root &&
        echo "[AGROCONTROL BACKUP] Servicio iniciado. Ejecutando respaldo de verificación inicial..." &&
        /bin/sh /backup.sh &&
        crond -f -l 2
    networks:
      - agrocontrol-net

# ------------------------------------------------------------------------------
# VOLÚMENES PERSISTENTES Y REDES
# ------------------------------------------------------------------------------
volumes:
  agrocontrol_pgdata:
    name: agrocontrol_pgdata

networks:
  agrocontrol-net:
    name: agrocontrol-net
    driver: bridge
