server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Compresión Gzip para optimizar transferencia en red local
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1000;

    # Cabeceras de seguridad. La SPA, la PWA y la API se sirven desde el mismo
    # origen, por lo que la CSP no necesita orígenes externos.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /usr/share/nginx/html;

    # Service Worker y manifiesto: nunca en caché HTTP, para que las
    # actualizaciones de la PWA se detecten en la siguiente visita.
    location = /sw.js {
        expires -1;
        try_files $uri =404;
    }
    location = /registerSW.js {
        expires -1;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires -1;
        try_files $uri =404;
    }

    # Assets con hash de contenido: caché larga.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Frontend SPA (build de Vite en Nginx)
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy hacia la API Backend (NestJS con prefijo /api).
    # Se resuelve el nombre en cada petición (DNS interno de Docker) para que
    # Nginx arranque aunque la API todavía no esté disponible.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        # La API envía sus propias cabeceras (Helmet, CSP restrictiva). Declarar
        # add_header aquí evita heredar las del servidor y duplicar la CSP.
        add_header X-Content-Type-Options "nosniff" always;
        set $api_upstream http://agrocontrol-api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Páginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
